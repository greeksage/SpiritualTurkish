name: Repair and apply SpiritualTurkish P15 beta candidate

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Reuse P15 payload from original bootstrap workflow
        shell: python
        run: |
          from pathlib import Path
          import base64, re, zipfile

          src = Path(".github/workflows/manual-p15-beta.yml")
          if not src.exists():
              raise SystemExit("Original .github/workflows/manual-p15-beta.yml is missing.")

          text = src.read_text(encoding="utf-8")
          marker = "cat > /tmp/spiritualturkish-p15.b64 <<'P15_PAYLOAD'"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Could not find the embedded P15 payload in the original workflow.")

          lines = text[start:].splitlines()[1:]
          encoded = []
          for line in lines:
              if line.strip() == "P15_PAYLOAD":
                  break
              encoded.append(line.strip())

          raw = base64.b64decode("".join(encoded))
          zip_path = Path("/tmp/spiritualturkish-p15.zip")
          zip_path.write_bytes(raw)

          out = Path("/tmp/spiritualturkish-p15")
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
              z.extractall(out)

          if not (out / "P15-apply.py").exists():
              raise SystemExit("Decoded P15 package is incomplete.")

          print(f"Recovered P15 package: {len(raw)} bytes")

      - name: Fix legacy 77-lesson regression test for P6 expansion
        shell: python
        run: |
          from pathlib import Path

          p = Path("tests/redesign.test.cjs")
          s = p.read_text(encoding="utf-8")

          old_title = "test('declared chapters contain all 77 lessons exactly once and preserve curriculum order',()=>{"
          new_title = "test('declared chapters contain all current lessons exactly once and preserve curriculum order',()=>{"

          old_assert = "assert.equal(catalog.courses.length,6);assert.equal(ordered.length,77);assert.equal(new Set(ordered).size,77);"
          new_assert = "const expected=c.ALL_LESSONS.length;assert.equal(catalog.courses.length,6);assert.equal(ordered.length,expected);assert.equal(new Set(ordered).size,expected);"

          if old_title in s:
              s = s.replace(old_title, new_title, 1)

          if old_assert in s:
              s = s.replace(old_assert, new_assert, 1)
          elif new_assert not in s:
              raise SystemExit("Could not find the legacy 77-lesson assertion to migrate.")

          p.write_text(s, encoding="utf-8")
          print("Migrated curriculum-size regression test to dynamic lesson count.")

      - name: Verify regression migration
        run: node --test tests/redesign.test.cjs

      - name: Apply cumulative P2-P15 candidate
        run: python /tmp/spiritualturkish-p15/P15-apply.py --repo "$GITHUB_WORKSPACE"

      - name: Re-run release evidence
        shell: bash
        run: |
          npm run release:evidence
          npm run release:certify
          echo "Certification decision:"
          cat release-certification/decision.txt

      - name: Prepare release branch
        id: branch
        shell: bash
        run: |
          BRANCH="release/p15-beta-${{ github.run_number }}-repair"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"

          # Remove both one-use bootstrap workflows from the candidate.
          git rm -f .github/workflows/manual-p15-beta.yml || true
          git rm -f .github/workflows/manual-p15-beta-v2.yml || true

          # Never commit raw participant exports.
          rm -f field-test/results/*.json field-test/results/*.csv 2>/dev/null || true

          git add -A
          git status --short
          git commit -m "feat: apply SpiritualTurkish P2-P15 beta candidate"

      - name: Push release branch
        run: git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          DECISION="$(cat release-certification/decision.txt | tr -d '\r\n')"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "SpiritualTurkish P15 beta candidate" \
            --body "Applies the cumulative P2-P15 candidate and fixes the obsolete 77-lesson regression assertion.

          Current P15 certification: **$DECISION**.

          This remains a beta candidate while independent P13 specialist review and P14 target-user evidence are pending."
        continue-on-error: true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## SpiritualTurkish P15 repaired candidate"
            echo
            echo "**Branch:** \`${{ steps.branch.outputs.name }}\`"
            echo
            echo "**Certification:** \`$(cat release-certification/decision.txt | tr -d '\r\n')\`"
            echo
            echo "The stale 77-lesson regression was migrated and the cumulative candidate was applied."
          } >> "$GITHUB_STEP_SUMMARY"
