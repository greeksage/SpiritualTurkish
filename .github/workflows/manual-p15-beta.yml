          unzip -q /tmp/spiritualturkish-p15.zip -d /tmp/spiritualturkish-p15
          test -f /tmp/spiritualturkish-p15/P15-apply.py
          echo "P15 kit SHA-256: $(sha256sum /tmp/spiritualturkish-p15.zip | cut -d' ' -f1)"

      - name: Apply P2-P15 cumulative candidate
        run: python /tmp/spiritualturkish-p15/P15-apply.py --repo "$GITHUB_WORKSPACE"

      - name: Re-run release evidence and certification
        shell: bash
        run: |
          npm run release:evidence
          npm run release:certify
          echo "Certification decision:"
          cat release-certification/decision.txt
          echo "This branch is intentionally a beta candidate while human P13/P14 gates remain pending."

      - name: Prepare release branch
        id: branch
        shell: bash
        run: |
          BRANCH="release/p15-beta-${{ github.run_number }}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git rm -f .github/workflows/manual-p15-beta.yml || true
          rm -f field-test/results/*.json field-test/results/*.csv 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "feat: apply SpiritualTurkish P2-P15 beta candidate"

      - name: Push release branch
        shell: bash
        run: git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          DECISION="$(cat release-certification/decision.txt | tr -d '\r\n')"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "SpiritualTurkish P15 beta candidate" \
            --body "Applies the cumulative P2-P15 candidate without changing the frozen visual design.

          Current P15 certification: **$DECISION**.

          This is a beta candidate because independent P13 specialist review and P14 target-user evidence are still pending. Review the generated release-certification/report.md before merging."
        continue-on-error: true

      - name: Job summary
        shell: bash
        run: |
          {
            echo "## SpiritualTurkish P15 beta candidate"
            echo
            echo "**Branch:** \`${{ steps.branch.outputs.name }}\`"
            echo
            echo "**Certification:** \`$(cat release-certification/decision.txt | tr -d '\r\n')\`"
            echo
            echo "The cumulative implementation has been applied and pushed as a release branch."
            echo "Merge the generated PR (or merge the branch manually) to publish it from main."
          } >> "$GITHUB_STEP_SUMMARY"
