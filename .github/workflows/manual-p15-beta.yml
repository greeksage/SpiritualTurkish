name: Apply SpiritualTurkish P15 beta candidate

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install existing project dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for final browser checks
        run: npx playwright install --with-deps chromium
        continue-on-error: true

